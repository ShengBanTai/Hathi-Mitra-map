<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hathi Mitra Live Map</title>
    
    <!-- HTTPS Requirement Check -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: 'Segoe UI', sans-serif; }
        #map { height: 100%; width: 100%; }

        /* Floating Status Panel */
        .status-panel {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-align: center;
            width: 85%;
            max-width: 320px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .status-safe { border-left: 10px solid #2ecc71; color: #27ae60; }
        .status-danger { border-left: 10px solid #e74c3c; color: #c0392b; animation: pulse 1s infinite; }
        .status-warning { border-left: 10px solid #f39c12; color: #d68910; }
        .status-title { font-size: 14px; text-transform: uppercase; letter-spacing: 1px; }
        .status-msg { font-size: 18px; display: block; margin-top: 2px; }

        /* Controls Container (Bottom Right) */
        .controls-container {
            position: absolute;
            bottom: 30px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 1000;
        }

        /* Common Button Style */
        .map-btn {
            background-color: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            font-weight: bold;
            color: #333;
            cursor: pointer;
            border: 2px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
            font-size: clamp(12px, 2vw, 16px);
        }

        /* Driving Mode Active State */
        .drive-active {
            background-color: #4285F4; /* Google Blue */
            color: white;
            border-color: #4285F4;
            box-shadow: 0 0 15px rgba(66, 133, 244, 0.5);
        }

        .legend {
            position: absolute;
            bottom: 30px;
            left: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 10px;
            border-radius: 8px;
            font-size: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .legend-item { margin-bottom: 5px; display: flex; align-items: center; }
        .legend-icon { margin-right: 8px; font-size: clamp(14px, 3vw, 18px); }

        @keyframes pulse {
            0% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0.7); }
            70% { transform: translateX(-50%) scale(1.05); box-shadow: 0 0 0 10px rgba(231, 76, 60, 0); }
            100% { transform: translateX(-50%) scale(1); box-shadow: 0 0 0 0 rgba(231, 76, 60, 0); }
        }

        /* Responsive Emoji Icon Sizing */
        .emoji-icon {
            font-size: clamp(18px, 5vw, 32px);
            text-align: center;
            line-height: 1;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.3);
        }

        /* Retry Button */
        .retry-btn {
            background-color: #e74c3c;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .retry-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

    <div id="statusBox" class="status-panel status-safe">
        <span class="status-title">System Status</span>
        <span id="statusText" class="status-msg">Initializing GPS...</span>
        <div id="retryContainer"></div>
    </div>

    <div id="map"></div>

    <div class="controls-container">
        <button id="driveBtn" class="map-btn" aria-label="Toggle driving mode">
            🚗 Drive Mode: OFF
        </button>
        <button class="map-btn" aria-label="Recenter map on your location" onclick="recenterMap()">
            📍 Recenter
        </button>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="legend-icon">🛑</span> Danger Zone</div>
        <div class="legend-item"><span class="legend-icon">🏥</span> Hospital</div>
        <div class="legend-item"><span class="legend-icon">🚓</span> Police</div>
        <div class="legend-item"><span class="legend-icon">🌲</span> Forest Dept</div>
        <div class="legend-item"><span class="legend-icon">🔵</span> You</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // --- CONFIGURATION ---
        let isDrivingMode = false;
        let currentPos = null;
        let watchId = null;
        let gpsTimeoutId = null;
        let gpsErrorCount = 0;
        const GPS_TIMEOUT_THRESHOLD = 30000; // 30 seconds
        const GPS_ERROR_LIMIT = 3; // Retry limit

        // --- EXTERNAL CONFIG (Load from config.json or API) ---
        let dangerZones = [
            { name: "Chamundi Foot", lat: 12.2750, lng: 76.6700, radius: 800 },
            { name: "KRS Backwaters", lat: 12.3500, lng: 76.5500, radius: 1200 },
            { name: "Kabini Buffer", lat: 12.2500, lng: 76.6000, radius: 600 }
        ];

        let pois = [
            { type: "hospital", name: "Apollo Hospital", lat: 12.3020, lng: 76.6400, icon: "🏥" },
            { type: "hospital", name: "JSS Hospital", lat: 12.2950, lng: 76.6550, icon: "🏥" },
            { type: "police", name: "Lashkar Police Stn", lat: 12.3150, lng: 76.6580, icon: "🚓" },
            { type: "forest", name: "Aranya Bhavan", lat: 12.2850, lng: 76.6250, icon: "🌲" }
        ];

        // Load external configuration
        async function loadConfiguration() {
            try {
                const response = await fetch('config.json');
                if (response.ok) {
                    const config = await response.json();
                    dangerZones = config.dangerZones || dangerZones;
                    pois = config.pois || pois;
                    console.log("Configuration loaded from config.json");
                }
            } catch (error) {
                console.log("Using default configuration. (config.json not found or error occurred)");
            }
        }

        // --- MAP INIT ---
        const map = L.map('map', { zoomControl: false }).setView([12.2958, 76.6394], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // --- DRAW ELEMENTS ---
        function initializeMapElements() {
            dangerZones.forEach(zone => {
                L.circle([zone.lat, zone.lng], {
                    color: 'red',
                    fillColor: '#f03',
                    fillOpacity: 0.3,
                    radius: zone.radius
                }).addTo(map).bindPopup(`<b>⚠️ DANGER ZONE</b><br>${zone.name}`);
            });

            pois.forEach(poi => {
                const icon = L.divIcon({
                    className: 'emoji-icon',
                    html: poi.icon,
                    iconSize: [30, 30],
                    iconAnchor: [15, 15]
                });
                L.marker([poi.lat, poi.lng], { icon: icon })
                    .addTo(map)
                    .bindPopup(`<b>${poi.name}</b><br>${capitalize(poi.type)}`);
            });
        }

        function capitalize(str) {
            return str.charAt(0).toUpperCase() + str.slice(1);
        }

        let userMarker = null;
        let userCircle = null;

        // --- FUNCTIONS ---

        function toggleDrivingMode() {
            isDrivingMode = !isDrivingMode;
            const btn = document.getElementById('driveBtn');
            
            if (isDrivingMode) {
                btn.className = "map-btn drive-active";
                btn.innerHTML = "🚗 Drive Mode: ON";
                if (currentPos) {
                    map.flyTo([currentPos.lat, currentPos.lng], 18, { animate: true, duration: 1 });
                }
            } else {
                btn.className = "map-btn";
                btn.innerHTML = "🚗 Drive Mode: OFF";
                if (currentPos) {
                    map.flyTo([currentPos.lat, currentPos.lng], 15);
                }
            }
        }

        document.getElementById('driveBtn').addEventListener('click', toggleDrivingMode);

        function recenterMap() {
            if (currentPos) {
                map.flyTo([currentPos.lat, currentPos.lng], isDrivingMode ? 18 : 15);
            } else {
                updateStatusUI("warning", "Waiting for GPS signal...");
            }
        }

        // Haversine Distance
        function getDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; 
            const φ1 = lat1 * Math.PI/180;
            const φ2 = lat2 * Math.PI/180;
            const Δφ = (lat2-lat1) * Math.PI/180;
            const Δλ = (lon2-lon1) * Math.PI/180;
            const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ/2) * Math.sin(Δλ/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // --- STATUS UPDATE HELPER ---
        function updateStatusUI(status, message) {
            const statusBox = document.getElementById('statusBox');
            const statusText = document.getElementById('statusText');
            const retryContainer = document.getElementById('retryContainer');

            statusBox.className = `status-panel status-${status}`;
            statusText.innerHTML = message;

            if (status === 'warning' && gpsErrorCount >= GPS_ERROR_LIMIT) {
                retryContainer.innerHTML = '<button class="retry-btn" onclick="retryGPS()">🔄 Retry GPS</button>';
            } else {
                retryContainer.innerHTML = '';
            }
        }

        // --- CORE TRACKING LOOP ---
        function updateStatus(position) {
            // Clear timeout on successful position update
            clearTimeout(gpsTimeoutId);
            gpsErrorCount = 0;

            const userLat = position.coords.latitude;
            const userLng = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            currentPos = { lat: userLat, lng: userLng };

            // 1. Update/Create Marker (Prevent memory leak by reusing objects)
            if (!userMarker) {
                userMarker = L.marker([userLat, userLng]).addTo(map).bindPopup("You").openPopup();
                userCircle = L.circle([userLat, userLng], { radius: accuracy }).addTo(map);
                map.setView([userLat, userLng], 15);
            } else {
                userMarker.setLatLng([userLat, userLng]);
                userCircle.setLatLng([userLat, userLng]);
                userCircle.setRadius(accuracy);
            }

            // 2. DRIVING MODE LOGIC
            if (isDrivingMode) {
                map.flyTo([userLat, userLng], 18, { 
                    animate: true, 
                    duration: 0.5
                });
            }

            // 3. Danger Check
            let inDanger = false;
            let nearbyZone = "";

            for (let zone of dangerZones) {
                const dist = getDistance(userLat, userLng, zone.lat, zone.lng);
                if (dist < zone.radius) {
                    inDanger = true;
                    nearbyZone = zone.name;
                    break;
                }
            }

            // 4. Update UI
            if (inDanger) {
                updateStatusUI('danger', `⚠️ INSIDE ${nearbyZone}!`);
                playAlert(); // Fallback to audio if vibration not supported
            } else {
                updateStatusUI('safe', "You are in a SAFE ZONE");
            }
        }

        // --- ENHANCED ERROR HANDLING ---
        function handleError(error) {
            gpsErrorCount++;

            let errorMsg = "GPS Signal Lost";
            
            if (error.code === error.PERMISSION_DENIED) {
                errorMsg = "❌ GPS permission denied. Enable location access.";
            } else if (error.code === error.POSITION_UNAVAILABLE) {
                errorMsg = "❌ GPS position unavailable. Try moving outdoors.";
            } else if (error.code === error.TIMEOUT) {
                errorMsg = "⏱️ GPS timeout. Retrying...";
            }

            updateStatusUI('warning', errorMsg);

            // Set timeout for retry
            if (gpsErrorCount < GPS_ERROR_LIMIT) {
                gpsTimeoutId = setTimeout(() => {
                    if (gpsErrorCount > 0) {
                        handleError({ code: error.TIMEOUT });
                    }
                }, GPS_TIMEOUT_THRESHOLD);
            } else {
                updateStatusUI('warning', "GPS unavailable. Click retry or check settings.");
            }
        }

        // --- RETRY FUNCTION ---
        function retryGPS() {
            gpsErrorCount = 0;
            updateStatusUI('safe', 'Retrying GPS...');
            startGPS();
        }

        // --- VIBRATION & AUDIO FALLBACK ---
        function playAlert() {
            if (navigator.vibrate) {
                navigator.vibrate(200);
            } else {
                // Fallback: Use Web Audio API for sound
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.value = 800;
                    oscillator.type = 'sine';
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.log("Audio alert not available");
                }
            }
        }

        // --- HTTPS & GEOLOCATION CHECK ---
        function checkBrowserCompatibility() {
            const isHTTPS = window.location.protocol === 'https:' || window.location.hostname === 'localhost';
            
            if (!isHTTPS && window.location.hostname !== 'localhost') {
                updateStatusUI('warning', '⚠️ HTTPS required for GPS. Use secure connection.');
                return false;
            }

            if (!navigator.geolocation) {
                updateStatusUI('warning', '❌ Geolocation not supported on this device.');
                return false;
            }

            return true;
        }

        // --- START GPS TRACKING ---
        function startGPS() {
            if (!checkBrowserCompatibility()) return;

            watchId = navigator.geolocation.watchPosition(
                updateStatus,
                handleError,
                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        }

        // --- STOP GPS TRACKING ---
        function stopGPS() {
            if (watchId !== null) {
                navigator.geolocation.clearWatch(watchId);
            }
            if (gpsTimeoutId !== null) {
                clearTimeout(gpsTimeoutId);
            }
        }

        // --- INITIALIZE ---
        window.addEventListener('load', async () => {
            await loadConfiguration();
            initializeMapElements();
            startGPS();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', stopGPS);
    </script>
</body>
</html>
